name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install check-jsonschema
      - name: Validate JSON
        run: |
          find .cockpit .devcontainer .vscode examples \
            -type f -name '*.json' -print0 |
            xargs -0 -r -n1 python -m json.tool >/dev/null
      - name: Validate workshop profiles
        run: |
          check-jsonschema \
            --schemafile .cockpit/workshop.schema.json \
            .cockpit/workshop.json examples/*.json
      - name: Validate shell syntax
        run: |
          find .devcontainer/scripts -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
