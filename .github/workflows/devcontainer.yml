name: Devcontainer

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".codespace/**"
      - ".github/workflows/devcontainer.yml"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".devcontainer/**"
      - ".codespace/**"
      - ".github/workflows/devcontainer.yml"
      - "tests/**"
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name != 'schedule' || vars.ENABLE_SCHEDULED_DEVCONTAINER_CHECK == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test the devcontainer
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            bash .devcontainer/scripts/verify-environment.sh
            python -m unittest discover -s tests -v
